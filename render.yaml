# Render Blueprint — Static Site (Vite SPA)
# Dashboard: New → Blueprint → kapcsold a GitHub/GitLab repohoz
# Vagy manuálisan: Static Site → Build: npm install && npm run build → Publish: dist

services:
  - type: web
    name: virtualis-muzeum
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
